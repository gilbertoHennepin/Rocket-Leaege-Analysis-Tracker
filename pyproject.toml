[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rltracker"
version = "0.1.0"
description = "Rocket League replay analysis: stats, heat maps and coaching feedback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "subtr-actor-py>=1.5,<2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rltracker = "rltracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rltracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
