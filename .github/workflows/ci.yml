name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  viewer-core:
    # The Unreal viewer's playback math is engine-free, so it is tested here
    # with plain CMake. The Unreal project itself is built locally in UE 5.5.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S viewer/core-tests -B build/core-tests
      - run: cmake --build build/core-tests --config Release
      - run: ctest --test-dir build/core-tests -C Release --output-on-failure
